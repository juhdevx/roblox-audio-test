# Memory for the Gradle daemon. GitHub-hosted runners have 16 GB; Codespaces 2-core has 8 GB.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# ABIs to build and package. Android 10+ phones and Meta Quest 3/3S are arm64-v8a. Add more for
# emulators or old 32-bit phones, e.g. -Pvoiceshift.abis=arm64-v8a,armeabi-v7a,x86_64
voiceshift.abis=arm64-v8a
